# Local development dependencies for Sigma: PostgreSQL and Redis. Object storage (S3/MinIO) is
# added when asset uploads land; the API runs without it.
# Usage: docker compose -f infrastructure/docker/docker-compose.yml up -d
name: sigma

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sigma
      POSTGRES_USER: sigma
      POSTGRES_PASSWORD: sigma
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sigma -d sigma']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
