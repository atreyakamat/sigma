packages:
  - 'apps/*'
  - 'packages/*'
  - 'tests/benchmarks'
minimumReleaseAgeExclude:
  - '@nestjs/common@12.4.0'
  - '@nestjs/config@12.1.1'
  - '@nestjs/core@12.4.0'
  - '@nestjs/platform-express@12.4.0'
  - '@nestjs/cli@12.0.12'
  - '@nestjs/schematics@12.0.13'
  - '@nestjs/testing@12.4.0'
# Dependencies allowed to run install scripts (pnpm 12 fails the install otherwise).
# @prisma/engines downloads the schema engine used by `prisma migrate`.
# @swc/core is an optional peer of @nestjs/cli; its postinstall is not needed.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  '@swc/core': false
  # Electron downloads its runtime; embedded-postgres links its bundled PostgreSQL binaries.
  electron: true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/windows-x64': true
